name: Build FluxLauncher APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🔍 Rileva il tipo di progetto
    - name: Detect project type
      id: detect
      run: |
        echo "=== Struttura root ==="
        ls -la
        echo "=== Sottocartelle principali ==="
        find . -maxdepth 2 -type d
        echo "=== Cerca settings.gradle ==="
        find . -name "settings.gradle*" -type f
        echo "=== Cerca pubspec.yaml ==="
        find . -name "pubspec.yaml" -type f
        
        if [ -f "pubspec.yaml" ]; then
          echo "type=flutter" >> $GITHUB_OUTPUT
          echo "✅ Progetto Flutter"
        elif [ -f "android/settings.gradle" ] || [ -f "app/settings.gradle" ]; then
          echo "type=gradle_android" >> $GITHUB_OUTPUT
          echo "✅ Progetto Android con Gradle in sottocartella"
        else
          echo "type=unknown" >> $GITHUB_OUTPUT
          echo "❌ Tipo non riconosciuto"
          exit 1
        fi

    # 🛠️ Build per Flutter
    - name: Setup Flutter
      if: steps.detect.outputs.type == 'flutter'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'

    - name: Flutter doctor
      if: steps.detect.outputs.type == 'flutter'
      run: flutter doctor -v

    - name: Build Flutter APK
      if: steps.detect.outputs.type == 'flutter'
      run: |
        flutter pub get
        flutter build apk --debug
        echo "✅ Build Flutter completata"

    # 🛠️ Build per Android (con Gradle in sottocartella)
    - name: Grant execute permission (Android)
      if: steps.detect.outputs.type == 'gradle_android'
      run: |
        chmod +x gradlew || true
        chmod +x android/gradlew 2>/dev/null || true

    - name: Build Android APK
      if: steps.detect.outputs.type == 'gradle_android'
      run: |
        if [ -d "android" ] && [ -f "android/settings.gradle" ]; then
          cd android
          ../gradlew assembleDebug
        else
          GRADLE_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -1)
          if [ -n "$GRADLE_DIR" ]; then
            cd $GRADLE_DIR
            ./gradlew assembleDebug
          else
            echo "❌ Impossibile trovare la directory del progetto Gradle"
            exit 1
          fi
        fi
        echo "✅ Build Android completata"

    # 🔍 Debug: mostra tutto dopo la build
    - name: Debug build output
      if: always()
      run: |
        echo "=== TIPO PROGETTO: ${{ steps.detect.outputs.type }} ==="
        echo ""
        echo "=== Root directory ==="
        ls -la
        echo ""
        echo "=== Cartelle build trovate ==="
        find . -type d -name "build"
        echo ""
        echo "=== Contenuto di ogni cartella build/ ==="
        for dir in $(find . -type d -name "build"); do
          echo "--- $dir ---"
          ls -laR "$dir" 2>/dev/null || echo "  (vuota o inaccessibile)"
        done
        echo ""
        echo "=== APK trovati ==="
        find . -name "*.apk" -type f
        echo ""
        echo "=== Output di Flutter (se presente) ==="
        find . -path "*/flutter-apk/*" 2>/dev/null || echo "  Nessuno"
        echo ""
        echo "=== Output di Android (se presente) ==="
        find . -path "*/apk/debug/*" 2>/dev/null || echo "  Nessuno"

    # 📦 Upload APK (cerca ovunque)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: flux-launcher-apk
        path: |
          **/*.apk
        if-no-files-found: warn   # Messo a warn invece di error per non bloccare il workflow
