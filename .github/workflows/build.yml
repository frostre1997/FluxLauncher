name: Build FluxLauncher APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find project root
      id: find_root
      run: |
        # Cerca la directory che contiene settings.gradle
        PROJ_DIR=$(find . -name "settings.gradle*" -type f -exec dirname {} \; | head -1)
        if [ -z "$PROJ_DIR" ]; then
          echo "No Gradle project found!"
          exit 1
        fi
        echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV
        echo "Found project in: $PROJ_DIR"

    - name: Grant execute permission
      run: |
        chmod +x ${{ env.PROJECT_DIR }}/gradlew || chmod +x gradlew

    - name: Build APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: flux-launcher-apk
        path: |
          ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
