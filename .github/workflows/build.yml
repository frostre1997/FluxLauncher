name: Build FluxLauncher APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.x'

    - name: Build APK
      run: |
        flutter pub get
        flutter build apk --debug

    # 🔍 Step di debug: trova l'APK generato
    - name: Locate APK
      id: locate
      run: |
        echo "=== Cercando tutti gli APK ==="
        find . -name "*.apk" -type f
        APK_PATH=$(find . -name "*.apk" -type f | head -1)
        if [ -z "$APK_PATH" ]; then
          echo "❌ Nessun APK trovato!"
          exit 1
        fi
        echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
        echo "✅ APK trovato in: $APK_PATH"

    # 📦 Upload dell'APK (usa il percorso trovato)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: flux-launcher-apk
        path: ${{ env.APK_PATH }}
        if-no-files-found: error   # fallisce se non trova l'APK
